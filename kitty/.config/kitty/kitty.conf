# Kitty Configuration
# Only overrides are listed, in the section order of kitty's reference config.
# Full commented reference:
#   kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'

# =============================================================================
# FONTS
# =============================================================================
font_family Hack Nerd Font Mono
font_size   12.0

# =============================================================================
# WINDOW LAYOUT
# =============================================================================
# splits gives free-form horizontal/vertical splits; stack is only used for zoom.
enabled_layouts       splits, stack
window_padding_width  0
active_border_color   #e6b450
inactive_border_color #555555

# =============================================================================
# TAB BAR
# =============================================================================
# Black tab bar (kitty's defaults are light grey). On all-black, tabs need their
# own demarcation: powerline blocks with numbered titles, inactive tabs a shade
# off black, and the active tab dark grey with Ayu yellow text.
# Fixed-width tabs: tab_bar.py centres "N: [🖥️ ]title" and prefixes SSH panes
# (see that file). tab_title_max_length truncates longer titles (with …).
tab_bar_edge            top
tab_bar_margin_height   4.0 4.0
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{custom}"
tab_title_max_length    28
tab_bar_background      #000000
tab_bar_margin_color    #000000
active_tab_foreground   #e6b450
active_tab_background   #2a2f3a
active_tab_font_style   bold
inactive_tab_foreground #686868
inactive_tab_background #151a21

# =============================================================================
# COLOR SCHEME
# =============================================================================
# Custom Ayu theme (ayu-dark palette) on a true black background, defined here
# rather than via `kitten themes`: kitty's own "Ayu" is an older palette, and the
# themes kitten rewrites this file.
foreground           #bfbdb6
background           #000000
selection_foreground #0b0e14
selection_background #409fff
cursor               #e6b450
cursor_text_color    #0b0e14

# black
color0  #11151c
color8  #686868
# red
color1  #ea6c73
color9  #f07178
# green
color2  #7fd962
color10 #aad94c
# yellow
color3  #f9af4f
color11 #ffb454
# blue
color4  #53bdfa
color12 #59c2ff
# magenta
color5  #cda1fa
color13 #d2a6ff
# cyan
color6  #90e1c6
color14 #95e6cb
# white
color7  #c7c7c7
color15 #ffffff

# =============================================================================
# OS SPECIFIC TWEAKS
# =============================================================================
# Black title bar, matching the window rather than the system grey.
macos_titlebar_color       background
macos_option_as_alt        yes
# No title anywhere: the title bar stays but is blank, and nothing goes in the
# menu bar. Kitty's default (all) shows it in both.
macos_show_window_title_in none

# =============================================================================
# KEYBOARD SHORTCUTS
# =============================================================================
# --- Panes (kitty "windows") ---
# cmd+d split right, cmd+shift+d split down (the common macOS convention).
# Overrides kitty's default cmd+shift+d, which closes a pane.
map cmd+d       launch --location=vsplit
map cmd+shift+d launch --location=hsplit

# Close pane; asks first only when it is running a command (ignore-shell: a pane
# at a shell prompt closes at once). Overrides kitty's default cmd+w, which closes
# a tab. Tabs and OS windows already ask in that case, via kitty's default
# confirm_os_window_close -1.
map cmd+w close_window_with_confirmation ignore-shell

# Zoom the current pane.
map cmd+shift+z toggle_layout stack

# Pane focus. Not ctrl+h/j/k/l: kitty can't pass them through when no pane lies
# that way, so binding them would steal the keys from Neovim and tmux always.
# cmd+alt+h replaces kitty's hide_macos_other_apps.
map cmd+alt+h neighboring_window left
map cmd+alt+j neighboring_window down
map cmd+alt+k neighboring_window up
map cmd+alt+l neighboring_window right

# Resize the current pane. cmd+ctrl+l replaces kitty's clear_terminal to_cursor.
map cmd+ctrl+h resize_window narrower
map cmd+ctrl+l resize_window wider
map cmd+ctrl+k resize_window taller
map cmd+ctrl+j resize_window shorter

# --- OS window ---
# Maximise to fill the screen, keeping the menu bar and Dock: macOS zoom, what
# option+green button does, from the keyboard. ctrl+cmd+f stays native full screen.
map cmd+ctrl+m toggle_maximized

# --- Tabs ---
# Jump to tab N. Kitty's defaults give cmd+1..9 to panes (first_window ...) and
# bind nothing to goto_tab; panes keep ctrl+shift+1..9.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
