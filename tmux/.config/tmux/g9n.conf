# g9n — personal tmux chrome (codename: gunasekaran)
#
# g9n palette: Ayu dark on true black — same hex as Terminal / kitty.
# Does not set status-left/right: those stay with `trails keys` (workspaces,
# task, checklist, clock). Sourced from tmux.conf after trails keys.
#
# Active:   #e6b450 on #2a2f3a
# Inactive: #686868 on #151a21
# Bar / bg: #000000
# Borders:  active #e6b450, inactive #555555

set -g status-position bottom
set -g status-style "bg=#000000,fg=#bfbdb6"
set -g status-justify left

# Window tabs — slanted parallelogram ( / ), same as kitty
# tab_powerline_style slanted. Not trapezoid (/), not pills ().
# One space after the left slant; none before the right (avoids a coloured
# “cap” artefact after the tab).
# Use #W (window name), not #T (pane title). Trails stores the trail id/name
# in the window name and puts "agent · task" in the pane title for status-right.
# Truncated/padded to 25 (left-aligned; tmux has no center pad).
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#151a21,bg=#000000]#[fg=#686868,bg=#151a21] #{p25:#{=/25/…:#{window_index}: #{window_name}}}#[fg=#151a21,bg=#000000]"
setw -g window-status-current-format "#[fg=#2a2f3a,bg=#000000]#[fg=#e6b450,bg=#2a2f3a,bold] #{p25:#{=/25/…:#{window_index}: #{window_name}}}#[fg=#2a2f3a,bg=#000000]"
setw -g window-status-style "bg=#000000,fg=#686868"
setw -g window-status-current-style "bg=#000000,fg=#e6b450"
setw -g window-status-activity-style "fg=#f9af4f,bg=#151a21"
setw -g window-status-bell-style "fg=#ea6c73,bg=#151a21"

set -g pane-border-style "fg=#555555"
set -g pane-active-border-style "fg=#e6b450"

set -g message-style "fg=#0b0e14,bg=#e6b450,bold"
set -g message-command-style "fg=#0b0e14,bg=#e6b450"
setw -g mode-style "fg=#0b0e14,bg=#409fff"
set -g clock-mode-colour "#e6b450"

%if "#{e|>=|f:#{s/[^0-9.]//:version},3.8}"
set -g popup-border-style "bg=terminal,fg=#555555"
%endif
