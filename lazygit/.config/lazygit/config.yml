gui:
  showDivergenceFromBaseBranch: arrowAndNumber
  tabWidth: 2
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 3
  shrinkSidePanelsToContent: true
refresher:
  refreshInterval: 5
notARepository: skip
git:
  diffContextSize: 5
  log:
    showWholeGraph: true
  diffRenderers:
    - name: delta
      command: delta --{{colorScheme}} --paging=never
    - name: delta (side-by-side)
      command: delta --{{colorScheme}} --paging=never --side-by-side
